<!DOCTYPE html><html><head><meta charset="utf-8"><title>proactive probe</title></head>
<body style="font:14px/1.6 ui-monospace,Menlo,monospace;padding:18px;background:#111;color:#0f0">
<pre id="out">booting…</pre>
<script>
var L=[],o=document.getElementById('out');
function p(s){L.push(new Date().toLocaleTimeString('en-GB',{hour12:false})+'  '+s);o.textContent=L.join('\n');}
window.addEventListener('error',function(e){p('!! window error: '+e.message);});
window.adaSettings={
  handle:"journify-sandbox",
  enableProgrammaticControl:true,
  adaReadyCallback:function(){p('** adaReadyCallback FIRED');},
  toggleCallback:function(x){p('** toggleCallback('+x+')');}
};
var t0=Date.now();
var iv=setInterval(function(){
  if(!window.adaEmbed) return;
  clearInterval(iv);
  p('adaEmbed present @'+(Date.now()-t0)+'ms');
  setTimeout(function(){
    p('button frame: '+!!document.getElementById('ada-button-frame')
      +' | chat frame: '+!!document.getElementById('ada-chat-frame'));
    p('--> triggerProactive({messageKey:"idlepdp"})');
    try{
      var r=window.adaEmbed.triggerProactive({messageKey:"idlepdp"});
      p('    returned: '+(r&&r.then?'Promise':String(r)));
      if(r&&r.then) r.then(function(v){p('    RESOLVED '+JSON.stringify(v||null));})
                     .catch(function(e){p('    REJECTED '+e);});
    }catch(e){p('    THREW '+e.message);}

    p('--> toggle()');
    window.adaEmbed.toggle().then(function(){p('    toggle resolved');})
                            .catch(function(e){p('    toggle rejected '+e);});

    setTimeout(function(){
      p('chat frame now: '+!!document.getElementById('ada-chat-frame'));
      window.adaEmbed.getInfo().then(function(i){p('getInfo '+JSON.stringify(i));})
                               .catch(function(e){p('getInfo err '+e);});
      window.adaEmbed.getMessages().then(function(m){
        p('MESSAGES ('+m.length+'):');
        m.forEach(function(x){p('   ['+x.role+'] '+JSON.stringify(x.body||x.content||x).slice(0,160));});
      }).catch(function(e){p('getMessages err '+e);});
    },9000);
  },3500);
},100);
</script>
<script async src="https://static.ada.support/embed2.js"></script>
</body></html>
